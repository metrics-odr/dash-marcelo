name: Rotina Diaria de Briefings com Gemini

on:
  schedule:
    # Executa todos os dias às 23:59 BRT (02:59 UTC)
    - cron: '59 2 * * *'
  workflow_dispatch:

jobs:
  atualizar-briefings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install google-generativeai

      - name: Executar script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_briefing_gemini.py

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build/relatorios.json
          git commit -m "Atualiza briefings do Gestor via Gemini" || exit 0
          git push origin main
