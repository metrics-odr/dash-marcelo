name: Rotina Diaria de Briefings com Gemini

on:
  schedule:
    - cron: '59 2 * * *'
  workflow_dispatch:

jobs:
  atualizar-briefings:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install google-genai

      - name: Executar geracao de briefings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_briefing_gemini.py

      - name: Commitar e fazer Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/relatorios.json
          git commit -m "Atualiza briefings do Gestor (rotina diária via Gemini API)" || exit 0
          git push origin main
